x-medwatch: &medwatch
  build: { context: ., dockerfile: docker/Dockerfile }
  image: medwatch:local
  env_file:
    - path: .env
      required: false
  environment: &env
    MEDWATCH_DATA_DIR: /app/data
    MEDWATCH_MODELS_DIR: /app/models
    MEDWATCH_OUTPUTS_DIR: /app/outputs
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    - ./outputs:/app/outputs

services:
  # CLI avulsa: docker compose run --rm medwatch <comando>
  medwatch:
    <<: *medwatch
    profiles: [cli]

  api:
    <<: *medwatch
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  dashboard:
    <<: *medwatch
    command: ["dashboard", "--port", "8501"]
    environment:
      <<: *env
      MEDWATCH_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: { condition: service_healthy }

  # cenário da demo enviado à API: docker compose --profile demo up
  simulator:
    <<: *medwatch
    profiles: [demo]
    command: ["simulate", "--scenario", "demo", "--target", "http://api:8000"]
    depends_on:
      api: { condition: service_healthy }
