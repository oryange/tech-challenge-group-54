name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      # índice CPU do PyTorch: evita baixar os wheels CUDA (~5 GB) no runner
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: pytest -m "not azure and not slow"
        env: { MEDWATCH_AZURE_MOCK: "true" }
