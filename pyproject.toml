[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medwatch"
version = "0.1.0"
description = "Monitoramento multimodal de pacientes (vídeo, áudio, sinais vitais) com Azure AI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# As dependências ficam em requirements.txt (fonte única). Instale com:
#   pip install -r requirements.txt
dependencies = []

[project.scripts]
medwatch = "medwatch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=medwatch --cov-report=term-missing"
markers = [
  "azure: requer credenciais Azure reais (não roda no CI)",
  "slow: testes com modelos/datasets reais",
]
